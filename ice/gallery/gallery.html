<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images of Christ</title>
    <style>
        body {
            background: black;
        }
        #wrapper {
            width: 800px;
            margin: 0 auto;
        }
        nav {
            color: white;
            text-align: center;
            font-family: Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }
        #gallery {
            display: grid;
            grid-template-columns: repeat(4, 200px);
            border: 15px solid rgb(255, 255, 255);
            width: 100%;
            background-color: #ddd;
            background-image:
                linear-gradient(45deg, #ccc 26%, transparent 26%), 
                linear-gradient(135deg, #ccc 26%, transparent 26%),
                linear-gradient(45deg, transparent 75%, #ccc 75%),
                linear-gradient(135deg, transparent 75%, #ccc 75%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 0, 10px -10px, 0px 10px; 
        }
        #gallery a {
            cursor: url('images/christus.png'), pointer;
        }
        #gallery img {
            width: 200px;
            height: 300px;
            opacity: 0.5;
            display: block;
            object-fit: cover;
        }
        #gallery img:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <nav>
            <h1>Christ Art Gallery</h1>
        </nav>
        <main>
            <div id="gallery">
                <a href="images/big/img1.jpg" target="_blank"><img src="images/small/img1.jpg" alt="Christ Artwork 1"></a>
                <a href="images/big/img2.jpg" target="_blank"><img src="images/small/img2.jpg" alt="Christ Artwork 2"></a>
                <a href="images/big/img3.jpg" target="_blank"><img src="images/small/img3.jpg" alt="Christ Artwork 3"></a>
                <a href="images/big/img4.jpg" target="_blank"><img src="images/small/img4.jpg" alt="Christ Artwork 4"></a>
                <a href="images/big/img5.jpg" target="_blank"><img src="images/small/img5.jpg" alt="Christ Artwork 5"></a>
                <a href="images/big/img6.jpg" target="_blank"><img src="images/small/img6.jpg" alt="Christ Artwork 6"></a>
                <a href="images/big/img7.jpg" target="_blank"><img src="images/small/img7.jpg" alt="Christ Artwork 7"></a>
                <a href="images/big/img8.jpg" target="_blank"><img src="images/small/img8.jpg" alt="Christ Artwork 8"></a>
                <a href="images/big/img9.jpg" target="_blank"><img src="images/small/img9.jpg" alt="Christ Artwork 9"></a>
                <a href="images/big/img10.jpg" target="_blank"><img src="images/small/img10.jpg" alt="Christ Artwork 10"></a>
                <a href="images/big/img11.jpg" target="_blank"><img src="images/small/img11.jpg" alt="Christ Artwork 11"></a>
                <a href="images/big/img12.jpg" target="_blank"><img src="images/small/img12.jpg" alt="Christ Artwork 12"></a>
            </div>
        </main>
    </div>
</body>
</html>
